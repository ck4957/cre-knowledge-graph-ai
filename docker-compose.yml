services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "${APP_HOST_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_kg
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: landmark-demo-password
      RAG_TOP_K: 4
    depends_on:
      seed:
        condition: service_completed_successfully

  seed:
    build:
      context: .
      target: seeder
    environment:
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_kg
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: landmark-demo-password
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: cre
      POSTGRES_DB: cre_kg
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cre -d cre_kg"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5-community
    ports:
      - "${NEO4J_HTTP_HOST_PORT:-7474}:7474"
      - "${NEO4J_BOLT_HOST_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: neo4j/landmark-demo-password
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p landmark-demo-password 'RETURN 1' || exit 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 18

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
