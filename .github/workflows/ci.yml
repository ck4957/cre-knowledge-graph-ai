name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Evaluate local GraphRAG quality
        run: npm run ai:evaluate

      - name: Audit
        run: npm audit

      - name: Build
        run: npm run build

      - name: Validate Docker Compose
        run: docker compose config

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - name: Terraform init
        working-directory: infra/aws/terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra/aws/terraform
        run: terraform validate

  local-stack:
    name: Live Docker stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Postgres, Neo4j, GraphRAG, and CRUD APIs
        run: npm run stack:verify
        env:
          STACK_VERIFY_TEARDOWN: "1"

      - name: Teardown Docker stack
        if: always()
        run: docker compose down -v

  compose-app:
    name: Full Compose app stack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify app container, Postgres, Neo4j, and GraphRAG
        run: npm run compose:verify
        env:
          COMPOSE_VERIFY_TEARDOWN: "1"

      - name: Teardown Docker stack
        if: always()
        run: docker compose down -v
